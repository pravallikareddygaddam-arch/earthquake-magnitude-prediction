name: Lab 8 - Earthquake MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "pipelines/**"
      - "requirements.txt"
      - "data/raw/Earthquake.csv.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  earthquake-mlops-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn pyyaml joblib

      - name: Validate earthquake dataset
        run: |
          python -c "import pandas as pd; d=pd.read_csv('data/raw/Earthquake.csv.csv'); required={'Date','Time','Latitude','Longitude','Magnitude'}; missing=required-set(d.columns); assert not missing, f'Missing columns: {missing}'; assert len(d)>0, 'Dataset is empty'; print(f'Dataset validation passed: {len(d)} rows')"

      - name: Check pipeline syntax
        run: |
          python -m compileall -q pipelines
          echo "Pipeline syntax checks passed"

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-lab8-ci-${{ github.run_number }}
          path: |
            data/raw/Earthquake.csv.csv
          if-no-files-found: ignore