name: Lab 8 - Earthquake MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "pipelines/**"
      - "src/**"
      - "experiments/lab08_ci_validation.py"
      - "requirements.txt"
      - "data/raw/Earthquake.csv.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  earthquake-mlops-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Lab 8 CI validation
        run: python experiments/lab08_ci_validation.py
      - name: Upload Lab 8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-lab8-ci-${{ github.run_number }}
          path: artifacts/lab08_ci_validation_report.json
          if-no-files-found: warn
